
services:
  mongodb:
    image: mongo:7
    container_name: node-app-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: node-app

  mailhog:
    image: mailhog/mailhog:latest
    container_name: node-app-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI  →  http://localhost:8025

volumes:
  mongo_data:
